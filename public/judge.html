<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審査員画面</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: #f0f2f5;
      color: #222;
    }
    header {
      background: #1a2a6c;
      color: #fff;
      padding: 16px 20px;
      text-align: center;
      position: relative;
    }
    header .judge-label { font-size: 14px; opacity: 0.85; }
    header .team-name { font-size: 30px; font-weight: bold; margin-top: 4px; }
    header .change-judge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 12px;
      color: #fff;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    main { max-width: 560px; margin: 0 auto; padding: 20px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .screen-title { font-size: 18px; font-weight: bold; margin: 0 0 16px; color: #1a2a6c; }
    .judge-list { display: flex; flex-direction: column; gap: 10px; }
    .judge-list button {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #1a2a6c;
      background: #fff;
      border: 2px solid #1a2a6c;
      border-radius: 8px;
      cursor: pointer;
    }
    .grid-legend { font-size: 13px; color: #555; margin-bottom: 12px; }
    .grid-legend .done-dot {
      display: inline-block; width: 12px; height: 12px; border-radius: 3px;
      background: #1a7a1a; vertical-align: middle; margin: 0 4px 0 10px;
    }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .team-grid button {
      padding: 14px 0;
      font-size: 16px;
      font-weight: bold;
      color: #1a2a6c;
      background: #fff;
      border: 2px solid #1a2a6c;
      border-radius: 8px;
      cursor: pointer;
    }
    .team-grid button.done {
      background: #1a7a1a;
      color: #fff;
      border-color: #1a7a1a;
    }
    .grid-progress { text-align: center; margin-top: 16px; font-size: 15px; color: #555; }
    .back-btn {
      background: none;
      border: none;
      color: #1a2a6c;
      font-size: 15px;
      cursor: pointer;
      padding: 0 0 12px;
    }
    .done-badge {
      text-align: center;
      color: #1a7a1a;
      font-weight: bold;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
    }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 16px; }
    .choices { display: flex; gap: 10px; }
    .choice {
      flex: 1;
      padding: 16px 0;
      font-size: 22px;
      font-weight: bold;
      color: #1a2a6c;
      background: #fff;
      border: 2px solid #1a2a6c;
      border-radius: 8px;
      cursor: pointer;
    }
    .choice.selected { background: #1a2a6c; color: #fff; }
    .subtotal {
      text-align: center;
      font-size: 20px;
      margin: 20px 0;
      padding: 14px;
      background: #eef1fb;
      border-radius: 8px;
    }
    .subtotal strong { font-size: 30px; color: #b21f1f; }
    button.submit {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: #b21f1f;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.submit:disabled { background: #999; cursor: not-allowed; }
    .locked-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
      font-size: 26px;
      font-weight: bold;
      color: #1a2a6c;
    }
    .locked .form-area { display: none; }
    .locked .locked-msg { display: block; }
    .status-bar {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <div class="judge-label" id="judgeLabel">審査員 --</div>
    <div class="team-name" id="teamName">事前審査</div>
    <button class="change-judge" id="changeJudgeBtn" style="display:none;">審査員を変更</button>
  </header>
  <main>
    <!-- 審査員選択画面 -->
    <div class="card screen" id="judgeSelectScreen">
      <h2 class="screen-title">審査員を選択してください</h2>
      <div class="judge-list" id="judgeList"></div>
    </div>

    <!-- チーム選択グリッド -->
    <div class="card screen" id="gridScreen">
      <h2 class="screen-title">採点するチームを選択</h2>
      <div class="grid-legend">
        タップして採点<span class="done-dot"></span>採点済み
      </div>
      <div class="team-grid" id="teamGrid"></div>
      <div class="grid-progress" id="gridProgress">-- / -- チーム 採点済み</div>
    </div>

    <!-- 採点画面 -->
    <div class="card screen" id="scoreScreen">
      <button class="back-btn" id="backBtn">← チーム一覧へ戻る</button>
      <div class="done-badge" id="doneBadge" style="display:none;">このチームは採点済みです（修正できます）</div>
      <div class="field">
        <label>課題の明確さ</label>
        <div class="choices" data-key="c1">
          <button type="button" class="choice" data-val="1">1</button>
          <button type="button" class="choice" data-val="2">2</button>
          <button type="button" class="choice" data-val="3">3</button>
        </div>
      </div>
      <div class="field">
        <label>ターゲットの具体性</label>
        <div class="choices" data-key="c2">
          <button type="button" class="choice" data-val="1">1</button>
          <button type="button" class="choice" data-val="2">2</button>
          <button type="button" class="choice" data-val="3">3</button>
        </div>
      </div>
      <div class="field">
        <label>着眼点のユニークさ</label>
        <div class="choices" data-key="c3">
          <button type="button" class="choice" data-val="1">1</button>
          <button type="button" class="choice" data-val="2">2</button>
          <button type="button" class="choice" data-val="3">3</button>
        </div>
      </div>
      <div class="field">
        <label>形の有無（実際に触れる）</label>
        <div class="choices" data-key="c4">
          <button type="button" class="choice" data-val="1">1</button>
          <button type="button" class="choice" data-val="2">2</button>
          <button type="button" class="choice" data-val="3">3</button>
        </div>
      </div>
      <div class="field">
        <label>伝わりやすさ</label>
        <div class="choices" data-key="c5">
          <button type="button" class="choice" data-val="1">1</button>
          <button type="button" class="choice" data-val="2">2</button>
          <button type="button" class="choice" data-val="3">3</button>
        </div>
      </div>
      <div class="field">
        <label>アプリの評価コメント</label>
        <textarea id="comment" rows="4" placeholder="良かった点・改善点など（任意）"></textarea>
      </div>
      <div class="subtotal">
        小計: <strong id="subtotal">0</strong> / 15
      </div>
      <button class="submit" id="submitBtn">送信する</button>
    </div>

    <div class="status-bar" id="statusBar">接続中...</div>
  </main>

  <script type="module">
    // ===== Firebase 初期化 =====
    // ▼▼▼ ここを自分のプロジェクトの設定値に差し替えてください ▼▼▼
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    // ▲▲▲ ここまで差し替え対象 ▲▲▲

    const JUDGE_KEY = 'judgeId';

    const judgeLabelEl = document.getElementById('judgeLabel');
    const teamNameEl = document.getElementById('teamName');
    const changeJudgeBtn = document.getElementById('changeJudgeBtn');
    const statusBar = document.getElementById('statusBar');

    const judgeSelectScreen = document.getElementById('judgeSelectScreen');
    const gridScreen = document.getElementById('gridScreen');
    const scoreScreen = document.getElementById('scoreScreen');
    const judgeListEl = document.getElementById('judgeList');
    const teamGridEl = document.getElementById('teamGrid');
    const gridProgress = document.getElementById('gridProgress');
    const subtotalEl = document.getElementById('subtotal');
    const submitBtn = document.getElementById('submitBtn');
    const backBtn = document.getElementById('backBtn');
    const doneBadge = document.getElementById('doneBadge');
    const commentEl = document.getElementById('comment');

    const urlParams = new URLSearchParams(window.location.search);
    let judgeId = urlParams.get('id') || localStorage.getItem(JUDGE_KEY);
    if (urlParams.get('id')) {
      localStorage.setItem(JUDGE_KEY, urlParams.get('id'));
    }

    let judges = {};   // { judgeId: { name, order } }
    let teams = {};    // { teamId: { name, order, no } }
    let myScores = {}; // { teamId: { c1..c5, total, comment } }
    let currentTeam = null;

    const scores = { c1: 0, c2: 0, c3: 0, c4: 0, c5: 0 };

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));

    // チーム番号: no があれば使用、無ければ order 順のインデックス+1
    function teamNoMap() {
      const map = {};
      byOrder(teams).forEach((id, i) => {
        map[id] = (teams[id].no != null) ? teams[id].no : (i + 1);
      });
      return map;
    }

    function showScreen(name) {
      judgeSelectScreen.classList.toggle('active', name === 'judge');
      gridScreen.classList.toggle('active', name === 'grid');
      scoreScreen.classList.toggle('active', name === 'score');
      changeJudgeBtn.style.display = (name === 'judge') ? 'none' : 'block';
    }

    // ---------- 審査員選択 ----------
    function renderJudgeList() {
      judgeListEl.innerHTML = '';
      const ids = byOrder(judges);
      if (ids.length === 0) {
        judgeListEl.innerHTML = '<p style="color:#999;">審査員が登録されていません。管理者にお問い合わせください。</p>';
        return;
      }
      ids.forEach((jid) => {
        const btn = document.createElement('button');
        btn.textContent = judges[jid].name;
        btn.addEventListener('click', () => {
          judgeId = jid;
          localStorage.setItem(JUDGE_KEY, jid);
          if (window.history.replaceState) {
            const url = new URL(window.location);
            url.searchParams.set('id', jid);
            window.history.replaceState(null, '', url);
          }
          judgeLabelEl.textContent = judges[jid].name;
          recomputeMyScores();
          showScreen('grid');
          renderGrid();
        });
        judgeListEl.appendChild(btn);
      });
    }

    changeJudgeBtn.addEventListener('click', () => {
      localStorage.removeItem(JUDGE_KEY);
      judgeId = null;
      if (window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      judgeLabelEl.textContent = '審査員 --';
      renderJudgeList();
      showScreen('judge');
    });

    // ---------- チームグリッド ----------
    function renderGrid() {
      teamGridEl.innerHTML = '';
      const ids = byOrder(teams);
      const noMap = teamNoMap();
      if (ids.length === 0) {
        teamGridEl.innerHTML = '<p style="color:#999;">チームが登録されていません。</p>';
        gridProgress.textContent = '0 / 0 チーム 採点済み';
        return;
      }
      ids.forEach((teamId) => {
        const btn = document.createElement('button');
        const done = !!myScores[teamId];
        btn.textContent = noMap[teamId] + (done ? ' ✓' : '');
        btn.title = teams[teamId].name;
        if (done) btn.classList.add('done');
        btn.addEventListener('click', () => openScore(teamId));
        teamGridEl.appendChild(btn);
      });
      const doneCount = ids.filter((id) => myScores[id]).length;
      gridProgress.textContent = doneCount + ' / ' + ids.length + ' チーム 採点済み';
    }

    // ---------- 採点画面 ----------
    function updateSubtotal() {
      const sum = Object.values(scores).reduce((a, b) => a + b, 0);
      subtotalEl.textContent = sum;
      return sum;
    }

    function selectValue(key, val) {
      scores[key] = val;
      const group = document.querySelector('.choices[data-key="' + key + '"]');
      Array.from(group.children).forEach((btn) => {
        btn.classList.toggle('selected', parseInt(btn.dataset.val, 10) === val);
      });
      updateSubtotal();
    }

    function resetForm() {
      Object.keys(scores).forEach((key) => {
        scores[key] = 0;
        const group = document.querySelector('.choices[data-key="' + key + '"]');
        Array.from(group.children).forEach((btn) => btn.classList.remove('selected'));
      });
      commentEl.value = '';
      updateSubtotal();
    }

    function openScore(teamId) {
      currentTeam = teamId;
      const noMap = teamNoMap();
      teamNameEl.textContent = 'No.' + noMap[teamId] + ' ' + teams[teamId].name;
      resetForm();
      const existing = myScores[teamId];
      if (existing) {
        selectValue('c1', existing.c1);
        selectValue('c2', existing.c2);
        selectValue('c3', existing.c3);
        selectValue('c4', existing.c4);
        selectValue('c5', existing.c5);
        commentEl.value = existing.comment || '';
        doneBadge.style.display = 'block';
      } else {
        doneBadge.style.display = 'none';
      }
      statusBar.textContent = '';
      showScreen('score');
    }

    document.querySelectorAll('.choices').forEach((group) => {
      const key = group.dataset.key;
      Array.from(group.children).forEach((btn) => {
        btn.addEventListener('click', () => {
          selectValue(key, parseInt(btn.dataset.val, 10));
        });
      });
    });

    backBtn.addEventListener('click', () => {
      teamNameEl.textContent = '事前審査';
      showScreen('grid');
      renderGrid();
    });

    submitBtn.addEventListener('click', () => {
      if (!currentTeam || !judgeId) return;
      const { c1, c2, c3, c4, c5 } = scores;
      if ([c1, c2, c3, c4, c5].some((v) => v === 0)) {
        statusBar.textContent = '全項目を選択してください';
        return;
      }
      const total = c1 + c2 + c3 + c4 + c5;
      const comment = commentEl.value.trim();
      submitBtn.disabled = true;
      set(ref(db, `scores/${currentTeam}/${judgeId}`), { c1, c2, c3, c4, c5, total, comment })
        .then(() => {
          submitBtn.disabled = false;
          teamNameEl.textContent = '事前審査';
          showScreen('grid');
          renderGrid();
        })
        .catch((e) => {
          submitBtn.disabled = false;
          statusBar.textContent = '送信エラー: ' + e.message;
        });
    });

    // 全得点データから自分の採点済みチームを抽出
    let allScores = {};
    function recomputeMyScores() {
      myScores = {};
      Object.entries(allScores).forEach(([teamId, judgeMap]) => {
        if (judgeId && judgeMap && judgeMap[judgeId]) myScores[teamId] = judgeMap[judgeId];
      });
    }

    // ---------- 起動時のルーティング ----------
    function route() {
      if (Object.keys(judges).length === 0) return; // 審査員リスト待ち

      const currentUrlId = new URLSearchParams(window.location.search).get('id');
      if (currentUrlId && judges[currentUrlId]) {
        judgeId = currentUrlId;
        localStorage.setItem(JUDGE_KEY, judgeId);
      }

      if (!judgeId || !judges[judgeId]) {
        localStorage.removeItem(JUDGE_KEY);
        judgeId = null;
        judgeLabelEl.textContent = '審査員 --';
        renderJudgeList();
        showScreen('judge');
        statusBar.textContent = '審査員を選択してください';
        return;
      }

      judgeLabelEl.textContent = judges[judgeId].name;
      recomputeMyScores();
      if (!scoreScreen.classList.contains('active')) {
        showScreen('grid');
        renderGrid();
      }
      statusBar.textContent = '';
    }

    // ---------- Firebase 監視 ----------
    onValue(ref(db, 'config/judges'), (snap) => {
      judges = snap.val() || {};
      route();
    });

    onValue(ref(db, 'config/teams'), (snap) => {
      teams = snap.val() || {};
      if (gridScreen.classList.contains('active')) renderGrid();
    });

    onValue(ref(db, 'scores'), (snap) => {
      allScores = snap.val() || {};
      recomputeMyScores();
      if (gridScreen.classList.contains('active')) renderGrid();
    });

    showScreen('judge');
  </script>
</body>
</html>
