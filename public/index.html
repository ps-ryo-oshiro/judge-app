<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審査得点発表システム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: #0d1030;
      color: #fff;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 40px 20px 10px;
    }
    header h1 { font-size: 32px; margin: 0; }
    header p { color: #aab; margin-top: 8px; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 20px 60px; }
    .group {
      background: #161a44;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .group h2 { margin: 0 0 16px; font-size: 18px; color: #ffd54a; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a.tile {
      display: block;
      padding: 16px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      transition: transform 0.1s, opacity 0.1s;
    }
    a.tile:hover { transform: translateY(-2px); opacity: 0.9; }
    a.display { background: linear-gradient(135deg, #b21f1f, #fdbb2d); flex: 1; text-align: center; }
    a.admin { background: #1a2a6c; flex: 1; text-align: center; }
    a.judge { background: #2a3f8c; min-width: 130px; text-align: center; }
    .note { color: #889; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>審査得点発表システム</h1>
    <p>下のメニューから各画面を開いてください</p>
  </header>
  <main>
    <div class="group">
      <h2>メイン発表画面（会場スクリーン用）</h2>
      <div class="links">
        <a class="tile display" href="display.html">メイン発表画面を開く</a>
      </div>
    </div>

    <div class="group">
      <h2>管理者・進行画面</h2>
      <div class="links">
        <a class="tile admin" href="admin.html">管理者画面を開く</a>
      </div>
    </div>

    <div class="group">
      <h2>審査員画面（審査員ごとに開く）</h2>
      <div class="links" id="judgeLinks"></div>
      <div class="note">各審査員は自分のリンクを開いてください（管理者画面で追加/削除できます）。</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const judgeLinks = document.getElementById('judgeLinks');
    onValue(ref(db, 'config/judges'), (snap) => {
      const judges = snap.val() || {};
      const ids = Object.keys(judges).sort(
        (a, b) => (judges[a].order || 0) - (judges[b].order || 0));
      judgeLinks.innerHTML = '';
      if (ids.length === 0) {
        judgeLinks.innerHTML = '<div class="note">審査員が登録されていません。管理者画面で追加してください。</div>';
        return;
      }
      ids.forEach((id) => {
        const a = document.createElement('a');
        a.className = 'tile judge';
        a.href = 'judge.html?id=' + id;
        a.textContent = judges[id].name;
        judgeLinks.appendChild(a);
      });
    });
  </script>
</body>
</html>
