<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加アプリ管理 - 管理者画面</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: #f0f2f5;
      color: #222;
    }

    header {
      background: #1a2a6c;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .brand-logo:hover {
      opacity: 0.85;
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 17px;
      color: #1a2a6c;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    .btn-primary {
      padding: 10px 18px;
      background: #1a2a6c;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #2a3f8c;
    }

    .bulk-area {
      margin-top: 14px;
      border-top: 1px solid #eee;
      padding-top: 14px;
    }

    .bulk-area label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }

    .bulk-area textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      resize: vertical;
      font-family: inherit;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px 14px;
      text-align: left;
      font-size: 15px;
    }

    th {
      background: #eef1fb;
      color: #1a2a6c;
    }

    .th-no {
      width: 80px;
      text-align: center;
    }

    .th-action {
      width: 100px;
      text-align: center;
    }

    .td-no {
      text-align: center;
      font-weight: bold;
      color: #555;
    }

    .td-action {
      text-align: center;
    }

    .remove-btn {
      padding: 6px 12px;
      background: #b21f1f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .remove-btn:hover {
      background: #d32f2f;
    }

    .danger-outline {
      padding: 8px 14px;
      background: #fff;
      color: #b21f1f;
      border: 1px solid #b21f1f;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .danger-outline:hover {
      background: #ffeef0;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .count-badge {
      background: #1a2a6c;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .empty-note {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <header>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="/" class="brand-logo">📱 事前審査app</a>
      <h1 style="font-size: 18px;">参加アプリ管理</h1>
    </div>
    <a href="/admin" class="back-btn">← 管理者画面に戻る</a>
  </header>
  <main>
    <div class="section">
      <h2>1. アプリの追加</h2>
      <!-- 単体追加 -->
      <div class="add-row">
        <input type="text" id="newTeamName" placeholder="アプリ名を入力（1件ずつ登録）" />
        <button class="btn-primary" id="addTeamBtn">追加</button>
      </div>

      <!-- 改行区切りで一括追加 -->
      <div class="bulk-area">
        <label for="bulkInput">一括追加（複数アプリを改行区切りで入力）:</label>
        <textarea id="bulkInput" placeholder="アプリA&#10;アプリB&#10;アプリC&#10;..."></textarea>
        <div style="margin-top: 8px; text-align: right;">
          <button class="btn-primary" id="bulkAddBtn">改行区切りで一括追加</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="header-actions">
        <h2 style="margin: 0;">2. 登録済みアプリ一覧 <span class="count-badge" id="appCount">0件</span></h2>
        <button class="danger-outline" id="clearAllBtn">全アプリ一括削除</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="th-no">No.</th>
              <th>アプリ名</th>
              <th class="th-action">操作</th>
            </tr>
          </thead>
          <tbody id="teamListBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const teamListBody = document.getElementById('teamListBody');
    const appCount = document.getElementById('appCount');
    const newTeamNameInput = document.getElementById('newTeamName');
    const bulkInput = document.getElementById('bulkInput');

    let teams = {};   // { teamId: { name, order, no } }
    let activeTeam = null;

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));
    const teamIds = () => byOrder(teams);

    function renderList() {
      const ids = teamIds();
      appCount.textContent = `${ids.length}件`;
      teamListBody.innerHTML = '';

      if (ids.length === 0) {
        teamListBody.innerHTML = '<tr><td colspan="3" class="empty-note">登録されたアプリはありません。上部フォームから追加してください。</td></tr>';
        return;
      }

      ids.forEach((teamId, index) => {
        const item = teams[teamId];
        const no = item.no != null ? item.no : (index + 1);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="td-no">No.${no}</td>
          <td><strong>${item.name}</strong></td>
          <td class="td-action" style="display: flex; gap: 6px; justify-content: center;">
            <button class="edit-btn" data-id="${teamId}" data-name="${item.name}" style="padding: 6px 12px; background: #1a2a6c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">編集</button>
            <button class="remove-btn" data-id="${teamId}" data-name="${item.name}">削除</button>
          </td>
        `;

        tr.querySelector('.edit-btn').addEventListener('click', () => {
          editTeam(teamId, item.name);
        });

        tr.querySelector('.remove-btn').addEventListener('click', () => {
          removeTeam(teamId, item.name);
        });

        teamListBody.appendChild(tr);
      });
    }

    function addTeam() {
      const name = newTeamNameInput.value.trim();
      if (!name) return;
      const nos = Object.values(teams).map((t) => t.no || 0);
      const nextNo = (nos.length ? Math.max(...nos) : 0) + 1;
      push(ref(db, 'config/teams'), { name, order: Date.now(), no: nextNo });
      newTeamNameInput.value = '';
    }

    function editTeam(teamId, currentName) {
      const newName = prompt('アプリ名を変更してください:', currentName);
      if (newName !== null) {
        const trimmed = newName.trim();
        if (trimmed && trimmed !== currentName) {
          update(ref(db, `config/teams/${teamId}`), { name: trimmed });
        }
      }
    }

    function bulkAddTeams() {
      const rawText = bulkInput.value;
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) {
        alert('追加するアプリ名を入力してください（改行区切り）。');
        return;
      }

      let nos = Object.values(teams).map((t) => t.no || 0);
      let currentMaxNo = nos.length ? Math.max(...nos) : 0;
      const baseTime = Date.now();

      lines.forEach((name, i) => {
        currentMaxNo++;
        push(ref(db, 'config/teams'), {
          name: name,
          order: baseTime + i,
          no: currentMaxNo
        });
      });

      bulkInput.value = '';
      alert(`${lines.length}件のアプリを一括追加しました。`);
    }

    function removeTeam(teamId, name) {
      if (!confirm(`アプリ「${name}」を削除しますか？（得点データも削除されます）`)) return;
      remove(ref(db, `config/teams/${teamId}`));
      remove(ref(db, `scores/${teamId}`));
      if (activeTeam === teamId) {
        const remaining = teamIds().filter((id) => id !== teamId);
        set(ref(db, 'activeTeam'), remaining[0] || null);
      }
    }

    document.getElementById('addTeamBtn').addEventListener('click', addTeam);
    newTeamNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTeam(); });
    document.getElementById('bulkAddBtn').addEventListener('click', bulkAddTeams);

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      const ids = teamIds();
      if (ids.length === 0) {
        alert('削除対象のアプリがありません。');
        return;
      }
      if (confirm(`本当に登録済みの全 ${ids.length} 件のアプリを削除しますか？\n（関連するすべての採点結果も削除されます）`)) {
        remove(ref(db, 'config/teams'));
        remove(ref(db, 'scores'));
        set(ref(db, 'activeTeam'), null);
      }
    });

    onValue(ref(db, 'config/teams'), (snap) => {
      teams = snap.val() || {};
      renderList();
    });

    onValue(ref(db, 'activeTeam'), (snap) => {
      activeTeam = snap.val() || null;
    });
  </script>
</body>

</html>
