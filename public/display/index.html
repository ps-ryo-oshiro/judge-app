<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審査結果発表 - 上位20アプリ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0d1030 0%, #1a1c4b 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 20px 20px 15px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .brand-logo:hover {
      opacity: 0.85;
    }
    header h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffd700, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }
    header .subtitle {
      font-size: 18px;
      color: #aab8c2;
      margin-top: 8px;
    }
    header .status-bar {
      font-size: 16px;
      color: #ffd54a;
      margin-top: 10px;
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(540px, 1fr));
      gap: 16px;
    }
    .column-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffd54a;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #ffd54a;
    }
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rank-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 20px;
      transition: transform 0.2s, background 0.2s;
    }
    .rank-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    .rank-card.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0.08) 100%);
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .rank-card.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.25) 0%, rgba(192, 192, 192, 0.08) 100%);
      border: 2px solid #c0c0c0;
    }
    .rank-card.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.25) 0%, rgba(205, 127, 50, 0.08) 100%);
      border: 2px solid #cd7f32;
    }
    .rank-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .rank-number {
      font-size: 24px;
      font-weight: bold;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .rank-1 .rank-number { background: #ffd700; color: #000; font-size: 26px; }
    .rank-2 .rank-number { background: #c0c0c0; color: #000; }
    .rank-3 .rank-number { background: #cd7f32; color: #fff; }

    .team-info {
      display: flex;
      flex-direction: column;
    }
    .team-name {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
    }
    .rank-1 .team-name { color: #fff7d6; }
    .submitted-status {
      font-size: 13px;
      color: #aab8c2;
      margin-top: 2px;
    }
    .score-badge {
      font-size: 28px;
      font-weight: bold;
      color: #ffd54a;
      text-align: right;
    }
    .score-unit {
      font-size: 16px;
      color: #fff;
      font-weight: normal;
      margin-left: 4px;
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      font-size: 22px;
      color: #889;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="/" class="brand-logo">📱 事前審査app</a>
    </div>
    <h1>🏆 審査結果発表 (上位20アプリ)</h1>
    <div class="subtitle">各審査員の採点合計点による総合順位</div>
    <div class="status-bar" id="statusBar">データ読み込み中...</div>
  </header>

  <main>
    <div class="ranking-grid" id="rankingGrid">
      <div class="ranking-column">
        <div class="column-title">TOP 1 - 10</div>
        <div class="ranking-list" id="top10List"></div>
      </div>
      <div class="ranking-column">
        <div class="column-title">TOP 11 - 20</div>
        <div class="ranking-list" id="top20List"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusBar = document.getElementById('statusBar');
    const top10List = document.getElementById('top10List');
    const top20List = document.getElementById('top20List');

    let teams = {};   // { teamId: { name, order, no } }
    let judges = {};  // { judgeId: { name, order } }
    let allScores = {}; // { teamId: { judgeId: { total } } }

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));

    function teamNoMap() {
      const map = {};
      byOrder(teams).forEach((id, i) => {
        map[id] = (teams[id].no != null) ? teams[id].no : (i + 1);
      });
      return map;
    }

    function renderRanking() {
      const teamIds = byOrder(teams);
      const judgeIdsList = byOrder(judges);
      const totalJudges = judgeIdsList.length;

      if (teamIds.length === 0) {
        top10List.innerHTML = '<div class="empty-msg">アプリが登録されていません</div>';
        top20List.innerHTML = '';
        statusBar.textContent = '登録済みアプリなし';
        return;
      }

      const noMap = teamNoMap();
      const rankedTeams = teamIds.map((teamId) => {
        const teamScores = allScores[teamId] || {};
        let sumTotal = 0;
        let submittedCount = 0;

        judgeIdsList.forEach((jid) => {
          if (teamScores[jid] && typeof teamScores[jid].total === 'number') {
            sumTotal += teamScores[jid].total;
            submittedCount++;
          }
        });

        return {
          id: teamId,
          name: 'No.' + noMap[teamId] + ' ' + teams[teamId].name,
          total: sumTotal,
          submittedCount: submittedCount,
          isComplete: totalJudges > 0 && submittedCount === totalJudges
        };
      });

      // 合計点数の降順でソート
      rankedTeams.sort((a, b) => b.total - a.total);

      // 上位20アプリを取得
      const top20 = rankedTeams.slice(0, 20);

      // ステータス表示
      const completedTeams = rankedTeams.filter(t => t.isComplete).length;
      statusBar.textContent = `登録アプリ数: ${teamIds.length} | 審査完了アプリ: ${completedTeams} / ${teamIds.length} | 審査員数: ${totalJudges}名`;

      top10List.innerHTML = '';
      top20List.innerHTML = '';

      top20.forEach((team, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = 'rank-card';
        if (rank === 1) card.classList.add('rank-1');
        else if (rank === 2) card.classList.add('rank-2');
        else if (rank === 3) card.classList.add('rank-3');

        card.innerHTML = `
          <div class="rank-left">
            <div class="rank-number">${rank}</div>
            <div class="team-info">
              <div class="team-name">${team.name}</div>
              <div class="submitted-status">採点完了: ${team.submittedCount} / ${totalJudges} 名</div>
            </div>
          </div>
          <div class="score-badge">
            ${team.total}<span class="score-unit">点</span>
          </div>
        `;

        if (rank <= 10) {
          top10List.appendChild(card);
        } else {
          top20List.appendChild(card);
        }
      });
    }

    onValue(ref(db, 'config/teams'), (snap) => {
      teams = snap.val() || {};
      renderRanking();
    });

    onValue(ref(db, 'config/judges'), (snap) => {
      judges = snap.val() || {};
      renderRanking();
    });

    onValue(ref(db, 'scores'), (snap) => {
      allScores = snap.val() || {};
      renderRanking();
    });
  </script>
</body>
</html>
