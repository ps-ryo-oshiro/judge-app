<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審査結果発表 - 上位20アプリ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0d1030 0%, #1a1c4b 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 20px 20px 15px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .brand-logo:hover {
      opacity: 0.85;
    }
    header h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffd700, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }
    header .subtitle {
      font-size: 18px;
      color: #aab8c2;
      margin-top: 8px;
    }
    header .status-bar {
      font-size: 16px;
      color: #ffd54a;
      margin-top: 10px;
      font-weight: bold;
    }
    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(540px, 1fr));
      gap: 16px;
    }
    .column-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffd54a;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #ffd54a;
    }
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rank-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 20px;
      transition: transform 0.2s, background 0.2s;
    }
    .rank-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    .rank-card.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0.08) 100%);
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .rank-card.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.25) 0%, rgba(192, 192, 192, 0.08) 100%);
      border: 2px solid #c0c0c0;
    }
    .rank-card.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.25) 0%, rgba(205, 127, 50, 0.08) 100%);
      border: 2px solid #cd7f32;
    }
    .rank-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .rank-number {
      font-size: 24px;
      font-weight: bold;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .rank-1 .rank-number { background: #ffd700; color: #000; font-size: 26px; }
    .rank-2 .rank-number { background: #c0c0c0; color: #000; }
    .rank-3 .rank-number { background: #cd7f32; color: #fff; }

    .team-info {
      display: flex;
      flex-direction: column;
    }
    .team-name {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
    }
    .rank-1 .team-name { color: #fff7d6; }
    .submitted-status {
      font-size: 13px;
      color: #aab8c2;
      margin-top: 2px;
    }
    .score-badge {
      font-size: 28px;
      font-weight: bold;
      color: #ffd54a;
      text-align: right;
    }
    .score-unit {
      font-size: 16px;
      color: #fff;
      font-weight: normal;
      margin-left: 4px;
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      font-size: 22px;
      color: #889;
    }
    .rank-card { cursor: pointer; }

    .detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .detail-overlay.active { display: flex; }
    .detail-modal {
      background: #1a1c4b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .detail-modal h2 {
      margin: 0 0 20px;
      font-size: 26px;
      color: #ffd54a;
      padding-right: 90px;
    }
    .detail-total {
      color: #fff;
      font-weight: normal;
      margin-bottom: 14px;
      font-size: 16px;
    }
    .detail-total strong { color: #ffd54a; font-size: 30px; margin: 0 4px; }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .detail-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    .radar-wrap { max-width: 420px; margin: 0 auto; width: 100%; }
    .comment-section { max-height: 70vh; overflow-y: auto; }
    .comment-section h3 { color: #ffd54a; margin-top: 0; font-size: 18px; }
    .comment-item {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .comment-judge { color: #ffd54a; font-weight: bold; margin-bottom: 6px; }
    .comment-body { color: #dfe6ec; line-height: 1.5; white-space: pre-wrap; }
    @media (max-width: 700px) {
      .detail-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="/" class="brand-logo">📱 事前審査app</a>
    </div>
    <h1>🏆 審査結果発表 (上位20アプリ)</h1>
    <div class="subtitle">各審査員の採点合計点による総合順位</div>
    <div class="status-bar" id="statusBar">データ読み込み中...</div>
  </header>

  <main>
    <div class="ranking-grid" id="rankingGrid">
      <div class="ranking-column">
        <div class="column-title">TOP 1 - 10</div>
        <div class="ranking-list" id="top10List"></div>
      </div>
      <div class="ranking-column">
        <div class="column-title">TOP 11 - 20</div>
        <div class="ranking-list" id="top20List"></div>
      </div>
    </div>
  </main>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal">
      <button class="close-btn" id="closeDetail">✕ 閉じる</button>
      <h2 id="detailTitle"></h2>
      <div class="detail-body">
        <div class="radar-wrap"><canvas id="radarCanvas"></canvas></div>
        <div class="comment-section">
          <div class="detail-total" id="detailTotal"></div>
          <h3>審査員コメント</h3>
          <div id="commentList"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusBar = document.getElementById('statusBar');
    const top10List = document.getElementById('top10List');
    const top20List = document.getElementById('top20List');

    const detailOverlay = document.getElementById('detailOverlay');
    const detailTitle = document.getElementById('detailTitle');
    const detailTotal = document.getElementById('detailTotal');
    const commentList = document.getElementById('commentList');

    const CRITERIA = [
      { key: 'c1', label: '課題の明確さ' },
      { key: 'c2', label: 'ターゲットの具体性' },
      { key: 'c3', label: '着眼点のユニークさ' },
      { key: 'c4', label: '形の有無' },
      { key: 'c5', label: '伝わりやすさ' },
    ];

    let teams = {};   // { teamId: { name, order, no } }
    let judges = {};  // { judgeId: { name, order } }
    let allScores = {}; // { teamId: { judgeId: { c1..c5, total, comment } } }
    let openTeamId = null;

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));

    function teamNoMap() {
      const map = {};
      byOrder(teams).forEach((id, i) => {
        map[id] = (teams[id].no != null) ? teams[id].no : (i + 1);
      });
      return map;
    }

    function renderRanking() {
      const teamIds = byOrder(teams);
      const judgeIdsList = byOrder(judges);
      const totalJudges = judgeIdsList.length;

      if (teamIds.length === 0) {
        top10List.innerHTML = '<div class="empty-msg">アプリが登録されていません</div>';
        top20List.innerHTML = '';
        statusBar.textContent = '登録済みアプリなし';
        return;
      }

      const noMap = teamNoMap();
      const rankedTeams = teamIds.map((teamId) => {
        const teamScores = allScores[teamId] || {};
        let sumTotal = 0;
        let submittedCount = 0;

        judgeIdsList.forEach((jid) => {
          if (teamScores[jid] && typeof teamScores[jid].total === 'number') {
            sumTotal += teamScores[jid].total;
            submittedCount++;
          }
        });

        return {
          id: teamId,
          name: 'No.' + noMap[teamId] + ' ' + teams[teamId].name,
          total: sumTotal,
          submittedCount: submittedCount,
          isComplete: totalJudges > 0 && submittedCount === totalJudges
        };
      });

      // 合計点数の降順でソート
      rankedTeams.sort((a, b) => b.total - a.total);

      // 上位20アプリを取得
      const top20 = rankedTeams.slice(0, 20);

      // ステータス表示
      const completedTeams = rankedTeams.filter(t => t.isComplete).length;
      statusBar.textContent = `登録アプリ数: ${teamIds.length} | 審査完了アプリ: ${completedTeams} / ${teamIds.length} | 審査員数: ${totalJudges}名`;

      top10List.innerHTML = '';
      top20List.innerHTML = '';

      top20.forEach((team, index) => {
        const rank = index + 1;
        const card = document.createElement('div');
        card.className = 'rank-card';
        if (rank === 1) card.classList.add('rank-1');
        else if (rank === 2) card.classList.add('rank-2');
        else if (rank === 3) card.classList.add('rank-3');

        card.innerHTML = `
          <div class="rank-left">
            <div class="rank-number">${rank}</div>
            <div class="team-info">
              <div class="team-name">${team.name}</div>
              <div class="submitted-status">採点完了: ${team.submittedCount} / ${totalJudges} 名</div>
            </div>
          </div>
          <div class="score-badge">
            ${team.total}<span class="score-unit">点</span>
          </div>
        `;

        card.addEventListener('click', () => openDetail(team.id));

        if (rank <= 10) {
          top10List.appendChild(card);
        } else {
          top20List.appendChild(card);
        }
      });
    }

    onValue(ref(db, 'config/teams'), (snap) => {
      teams = snap.val() || {};
      renderRanking();
    });

    onValue(ref(db, 'config/judges'), (snap) => {
      judges = snap.val() || {};
      renderRanking();
    });

    onValue(ref(db, 'scores'), (snap) => {
      allScores = snap.val() || {};
      renderRanking();
      if (detailOverlay.classList.contains('active') && openTeamId) {
        renderDetail(openTeamId);
      }
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function averageScores(teamId) {
      const teamScores = allScores[teamId] || {};
      const jids = byOrder(judges).filter((jid) => teamScores[jid]);
      const n = jids.length || 1;
      return CRITERIA.map(({ key }) =>
        jids.reduce((a, jid) => a + (Number(teamScores[jid][key]) || 0), 0) / n
      );
    }

    let radarChart = null;
    function drawRadar(teamId) {
      const data = averageScores(teamId);
      if (radarChart) radarChart.destroy();
      radarChart = new Chart(document.getElementById('radarCanvas'), {
        type: 'radar',
        data: {
          labels: CRITERIA.map((c) => c.label),
          datasets: [{
            label: '平均点',
            data,
            backgroundColor: 'rgba(255, 213, 74, 0.25)',
            borderColor: '#ffd54a',
            borderWidth: 2,
            pointBackgroundColor: '#ffd54a',
          }]
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0,
              max: 3,
              ticks: { stepSize: 1, color: '#ccc', backdropColor: 'transparent' },
              grid: { color: 'rgba(255, 255, 255, 0.2)' },
              angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
              pointLabels: {
                color: '#fff',
                font: { size: 14 },
                callback: (label, index) => [label, `(${data[index].toFixed(1)}点)`]
              }
            }
          },
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    function renderComments(teamId) {
      const teamScores = allScores[teamId] || {};
      const html = byOrder(judges).map((jid) => {
        const s = teamScores[jid];
        if (!s) return '';
        const comment = (s.comment && s.comment.trim()) || '（コメントなし）';
        return `
          <div class="comment-item">
            <div class="comment-judge">${escapeHtml(judges[jid].name)}（${Number(s.total) || 0}点）</div>
            <div class="comment-body">${escapeHtml(comment)}</div>
          </div>`;
      }).join('');
      commentList.innerHTML = html || '<div class="empty-msg">まだ採点がありません</div>';
    }

    function teamTotal(teamId) {
      const teamScores = allScores[teamId] || {};
      return byOrder(judges).reduce((a, jid) => {
        const s = teamScores[jid];
        return a + (s && typeof s.total === 'number' ? s.total : 0);
      }, 0);
    }

    function renderDetail(teamId) {
      const noMap = teamNoMap();
      detailTitle.textContent = 'No.' + noMap[teamId] + ' ' + teams[teamId].name;
      detailTotal.innerHTML = `総合点数 <strong>${teamTotal(teamId)}</strong> 点`;
      drawRadar(teamId);
      renderComments(teamId);
    }

    function openDetail(teamId) {
      openTeamId = teamId;
      renderDetail(teamId);
      detailOverlay.classList.add('active');
    }

    function closeDetail() {
      detailOverlay.classList.remove('active');
      openTeamId = null;
      if (radarChart) { radarChart.destroy(); radarChart = null; }
    }

    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) closeDetail();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });
  </script>
</body>
</html>
