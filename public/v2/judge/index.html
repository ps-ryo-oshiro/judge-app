<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本番審査 - 審査員画面</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: #f0f2f5;
      color: #222;
    }
    header {
      background: #1a2a6c;
      color: #fff;
      padding: 16px 20px;
      text-align: center;
      position: relative;
    }
    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
      transition: opacity 0.2s;
    }
    .brand-logo:hover { opacity: 0.85; }
    header .judge-label { font-size: 14px; opacity: 0.85; }
    header .team-name { font-size: 30px; font-weight: bold; margin-top: 4px; }
    header .department-name { font-size: 16px; font-weight: bold; color: #ffd54a; margin-top: 6px; }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .screen-title { font-size: 18px; font-weight: bold; margin: 0 0 16px; color: #1a2a6c; }
    .grid-legend { font-size: 13px; color: #555; margin-bottom: 12px; }
    .team-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      max-height: 62vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .department-group { min-width: 0; }
    .department-title {
      margin: 0 0 8px;
      color: #1a2a6c;
      font-size: 16px;
      font-weight: bold;
    }
    .department-list { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 760px) {
      .team-list { grid-template-columns: 1fr; gap: 18px; }
    }
    .team-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      color: #1a2a6c;
      background: #fff;
      border: 2px solid #1a2a6c;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-align: left;
    }
    .team-list-item:hover { background: #f0f3ff; transform: translateY(-1px); }
    .team-list-item.done { border-color: #1a7a1a; background: #f4faf4; color: #1a7a1a; }
    .team-list-item .status-badge {
      font-size: 13px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      background: #eef1fb;
      color: #1a2a6c;
    }
    .team-list-item.done .status-badge { background: #1a7a1a; color: #fff; }
    .item-left { display: flex; align-items: center; min-width: 0; }
    .item-left .title { overflow: hidden; text-overflow: ellipsis; }
    .grid-progress { text-align: center; margin-top: 16px; font-size: 15px; color: #555; }
    .back-btn {
      background: none; border: none; color: #1a2a6c;
      font-size: 15px; cursor: pointer; padding: 0 0 12px;
    }
    .done-badge { text-align: center; color: #1a7a1a; font-weight: bold; margin-bottom: 14px; }
    textarea {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #bbb; border-radius: 8px; resize: vertical; font-family: inherit;
    }
    .field { margin-bottom: 22px; }
    .field label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 16px; }
    .field .weight { color: #b21f1f; font-size: 13px; font-weight: bold; margin-left: 6px; }
    .field .hint { font-size: 12px; color: #888; margin-bottom: 8px; }
    .choices { display: flex; gap: 8px; }
    .choice {
      flex: 1; padding: 14px 0; font-size: 20px; font-weight: bold;
      color: #1a2a6c; background: #fff; border: 2px solid #1a2a6c;
      border-radius: 8px; cursor: pointer;
    }
    .choice.selected { background: #1a2a6c; color: #fff; }
    .subtotal {
      text-align: center; font-size: 18px; margin: 20px 0;
      padding: 14px; background: #eef1fb; border-radius: 8px;
    }
    .subtotal strong { font-size: 30px; color: #b21f1f; }
    button.submit {
      width: 100%; padding: 16px; font-size: 20px; font-weight: bold;
      color: #fff; background: #b21f1f; border: none; border-radius: 8px; cursor: pointer;
    }
    button.submit:disabled { background: #999; cursor: not-allowed; }
    .status-bar { text-align: center; margin-top: 14px; font-size: 14px; color: #555; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: #1a7a1a;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 26px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="/v2" class="brand-logo">🏆 本番審査</a>
    </div>
    <div class="judge-label" id="judgeLabel">審査員 --</div>
    <div class="team-name" id="teamName">本番審査</div>
    <div class="department-name" id="departmentName"></div>
  </header>
  <main>
    <!-- 審査員案内画面（専用URL未設定時） -->
    <div class="card screen" id="judgeSelectScreen">
      <h2 class="screen-title" style="text-align:center; color:#b21f1f; margin-bottom:12px;">専用アクセスURLが必要です</h2>
      <p style="text-align:center; color:#555; line-height:1.6; font-size:15px; margin:0 0 16px;">
        管理者から配布された<strong>「専用アクセスURL」</strong>からページを開いてください。<br><br>
        <span style="font-size:13px; color:#888;">※審査員同士の誤操作・成りすましを防ぐため、自由な切り替え機能は無効化されています。</span>
      </p>
    </div>

    <!-- アプリ選択リスト（上位12アプリ） -->
    <div class="card screen" id="gridScreen">
      <h2 class="screen-title">審査するアプリを選択（上位12）</h2>
      <div class="grid-legend">リストをタップして採点を開始してください。</div>
      <div class="team-list" id="teamGrid"></div>
      <div class="grid-progress" id="gridProgress">-- / -- アプリ 採点済み</div>
    </div>

    <!-- 採点画面 -->
    <div class="card screen" id="scoreScreen">
      <button class="back-btn" id="backBtn">← アプリ一覧へ戻る</button>
      <div class="done-badge" id="doneBadge" style="display:none;">このアプリは採点済みです（修正できます）</div>
      <div id="fieldsWrap"></div>
      <div class="field">
        <label>審査コメント</label>
        <div class="hint">良かった点・改善点など（任意）</div>
        <textarea id="comment" rows="4" placeholder="コメントを入力"></textarea>
      </div>
      <div class="subtotal">
        換算スコア: <strong id="subtotal">0.0</strong> / 100
      </div>
      <button class="submit" id="submitBtn">送信する</button>
    </div>

    <div class="status-bar" id="statusBar">接続中...</div>
  </main>

  <div class="toast" id="toast">✓ 点数を送信しました</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 本番審査の評価項目（4項目・各1〜5点・重み付き）
    const CRITERIA = [
      { key: 'problemSetting', label: '課題設定', weight: 30, hint: '課題の明確さ・深さ' },
      { key: 'solutionIdea', label: '解決アイデア', weight: 30, hint: 'アイデアのユニークさ・妥当性' },
      { key: 'practicality', label: '実用性・完成度', weight: 25, hint: '実際に使えるか・完成度' },
      { key: 'presentation', label: 'プレゼン・伝え方', weight: 15, hint: '発表内容のわかりやすさ' },
    ];
    const TOP_N = 12;
    const JUDGE_KEY = 'v2JudgeId';

    const judgeLabelEl = document.getElementById('judgeLabel');
    const teamNameEl = document.getElementById('teamName');
    const departmentNameEl = document.getElementById('departmentName');
    const statusBar = document.getElementById('statusBar');

    const judgeSelectScreen = document.getElementById('judgeSelectScreen');
    const gridScreen = document.getElementById('gridScreen');
    const scoreScreen = document.getElementById('scoreScreen');
    const teamGridEl = document.getElementById('teamGrid');
    const gridProgress = document.getElementById('gridProgress');
    const subtotalEl = document.getElementById('subtotal');
    const submitBtn = document.getElementById('submitBtn');
    const backBtn = document.getElementById('backBtn');
    const doneBadge = document.getElementById('doneBadge');
    const commentEl = document.getElementById('comment');
    const fieldsWrap = document.getElementById('fieldsWrap');
    const toastEl = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let judgeId = urlParams.get('id') || localStorage.getItem(JUDGE_KEY);
    if (urlParams.get('id')) localStorage.setItem(JUDGE_KEY, urlParams.get('id'));

    let judges = {};        // /v2/config/judges
    let prelimTeams = {};   // /config/teams（参照のみ）
    let prelimScores = {};  // /scores（参照のみ）
    let v2Scores = {};      // /v2/scores
    let currentTeam = null;
    let top12 = [];         // 上位12の teamId 配列（得点降順）

    const scores = {};
    CRITERIA.forEach((c) => { scores[c.key] = 0; });

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));

    function departmentOf(team, no) {
      if (team.department) return team.department;
      const number = Number(no);
      if (number >= 1 && number <= 24) return 'ライフ部門';
      if (number >= 25 && number <= 39) return 'ローカル部門';
      if (number >= 40 && number <= 48) return 'ワーク部門';
      return '部門未設定';
    }

    function prelimTeamNoMap() {
      const map = {};
      byOrder(prelimTeams).forEach((id, i) => {
        map[id] = (prelimTeams[id].no != null) ? prelimTeams[id].no : (i + 1);
      });
      return map;
    }

    // 事前審査スコア（/scores）を集計し上位12チームを算出（参照のみ・書き込みなし）
    function prelimTotal(teamId) {
      const s = prelimScores[teamId] || {};
      return Object.keys(s).reduce((sum, jid) => {
        const sc = s[jid];
        return sum + (sc && typeof sc.total === 'number' ? sc.total : 0);
      }, 0);
    }

    function computeTop12() {
      top12 = byOrder(prelimTeams)
        .map((id) => ({ id, total: prelimTotal(id) }))
        .sort((a, b) => b.total - a.total)
        .slice(0, TOP_N)
        .map((r) => r.id);
    }

    // 換算スコア = Σ (入力点/5 × 重み)
    function calcTotal() {
      return CRITERIA.reduce((sum, c) => {
        const v = scores[c.key];
        return sum + (v > 0 ? (v / 5) * c.weight : 0);
      }, 0);
    }

    function myScoreOf(teamId) {
      const t = v2Scores[teamId] || {};
      return t[judgeId] || null;
    }

    function showScreen(name) {
      judgeSelectScreen.classList.toggle('active', name === 'judge');
      gridScreen.classList.toggle('active', name === 'grid');
      scoreScreen.classList.toggle('active', name === 'score');
    }

    function buildFields() {
      fieldsWrap.innerHTML = CRITERIA.map((c) => `
        <div class="field">
          <label>${c.label}<span class="weight">配点 ${c.weight}%</span></label>
          <div class="hint">${c.hint}</div>
          <div class="choices" data-key="${c.key}">
            ${[1, 2, 3, 4, 5].map((v) => `<button type="button" class="choice" data-val="${v}">${v}</button>`).join('')}
          </div>
        </div>`).join('');
      fieldsWrap.querySelectorAll('.choices').forEach((group) => {
        const key = group.dataset.key;
        Array.from(group.children).forEach((btn) => {
          btn.addEventListener('click', () => selectValue(key, parseInt(btn.dataset.val, 10)));
        });
      });
    }

    function updateSubtotal() {
      subtotalEl.textContent = calcTotal().toFixed(1);
    }

    function selectValue(key, val) {
      scores[key] = val;
      const group = fieldsWrap.querySelector('.choices[data-key="' + key + '"]');
      Array.from(group.children).forEach((btn) => {
        btn.classList.toggle('selected', parseInt(btn.dataset.val, 10) === val);
      });
      updateSubtotal();
    }

    function resetForm() {
      CRITERIA.forEach((c) => {
        scores[c.key] = 0;
        const group = fieldsWrap.querySelector('.choices[data-key="' + c.key + '"]');
        if (group) Array.from(group.children).forEach((btn) => btn.classList.remove('selected'));
      });
      commentEl.value = '';
      updateSubtotal();
    }

    function renderGrid() {
      computeTop12();
      teamGridEl.innerHTML = '';
      const noMap = prelimTeamNoMap();
      if (top12.length === 0) {
        teamGridEl.innerHTML = '<p style="color:#999; text-align:center; padding: 20px 0;">対象アプリがありません（事前審査データ待ち）。</p>';
        gridProgress.textContent = '0 / 0 アプリ 採点済み';
        return;
      }
      const departments = [
        { name: 'ライフ部門', teamIds: [] },
        { name: 'ワーク部門', teamIds: [] },
        { name: 'ローカル部門', teamIds: [] },
        { name: '部門未設定', teamIds: [] },
      ];
      top12.forEach((teamId) => {
        const department = departmentOf(prelimTeams[teamId], noMap[teamId]);
        const group = departments.find((item) => item.name === department) || departments[3];
        group.teamIds.push(teamId);
      });
      departments.forEach((department) => {
        if (department.teamIds.length === 0) return;
        const group = document.createElement('section');
        group.className = 'department-group';
        const heading = document.createElement('h3');
        heading.className = 'department-title';
        heading.textContent = department.name;
        const list = document.createElement('div');
        list.className = 'department-list';
        group.appendChild(heading);
        group.appendChild(list);
        department.teamIds.forEach((teamId) => {
        const btn = document.createElement('button');
        btn.className = 'team-list-item';
        const done = !!myScoreOf(teamId);
        if (done) btn.classList.add('done');

        const left = document.createElement('span');
        left.className = 'item-left';
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = 'No.' + noMap[teamId] + ' ' + prelimTeams[teamId].name;
        left.appendChild(title);

        const statusSpan = document.createElement('span');
        statusSpan.className = 'status-badge';
        statusSpan.textContent = done ? '✓ 採点済み' : '未採点';

        btn.appendChild(left);
        btn.appendChild(statusSpan);
        btn.addEventListener('click', () => openScore(teamId));
        list.appendChild(btn);
      });
        teamGridEl.appendChild(group);
      });
      const doneCount = top12.filter((id) => myScoreOf(id)).length;
      gridProgress.textContent = doneCount + ' / ' + top12.length + ' アプリ 採点済み';
    }

    function openScore(teamId) {
      currentTeam = teamId;
      const noMap = prelimTeamNoMap();
      teamNameEl.textContent = 'No.' + noMap[teamId] + ' ' + prelimTeams[teamId].name;
      departmentNameEl.textContent = departmentOf(prelimTeams[teamId], noMap[teamId]);
      resetForm();
      const existing = myScoreOf(teamId);
      if (existing) {
        const raw = existing.rawScores || {};
        CRITERIA.forEach((c) => { if (raw[c.key]) selectValue(c.key, raw[c.key]); });
        commentEl.value = existing.comment || '';
        doneBadge.style.display = 'block';
      } else {
        doneBadge.style.display = 'none';
      }
      statusBar.textContent = '';
      showScreen('score');
    }

    backBtn.addEventListener('click', () => {
      teamNameEl.textContent = '本番審査';
      departmentNameEl.textContent = '';
      showScreen('grid');
      renderGrid();
    });

    submitBtn.addEventListener('click', () => {
      if (!currentTeam || !judgeId) return;
      const missing = CRITERIA.some((c) => scores[c.key] === 0);
      if (missing) {
        statusBar.textContent = '全項目を選択してください';
        return;
      }
      const rawScores = {};
      CRITERIA.forEach((c) => { rawScores[c.key] = scores[c.key]; });
      const totalScore = Math.round(calcTotal() * 10) / 10;
      const comment = commentEl.value.trim();
      submitBtn.disabled = true;
      set(ref(db, `v2/scores/${currentTeam}/${judgeId}`), {
        judgeId, rawScores, totalScore, comment, updatedAt: Date.now()
      })
        .then(() => {
          submitBtn.disabled = false;
          teamNameEl.textContent = '本番審査';
          departmentNameEl.textContent = '';
          showScreen('grid');
          renderGrid();
          showToast('✓ 点数を送信しました');
        })
        .catch((e) => {
          submitBtn.disabled = false;
          statusBar.textContent = '送信エラー: ' + e.message;
        });
    });

    function route() {
      if (Object.keys(judges).length === 0 && !judgeId) {
        showScreen('judge');
        statusBar.textContent = '専用アクセスURLから開いてください';
        return;
      }
      const currentUrlId = new URLSearchParams(window.location.search).get('id');
      if (currentUrlId && judges[currentUrlId]) {
        judgeId = currentUrlId;
        localStorage.setItem(JUDGE_KEY, judgeId);
      }
      if (!judgeId || !judges[judgeId]) {
        if (Object.keys(judges).length === 0) return; // 審査員リスト待ち
        localStorage.removeItem(JUDGE_KEY);
        judgeId = null;
        judgeLabelEl.textContent = '審査員 --';
        showScreen('judge');
        statusBar.textContent = '専用アクセスURLから開いてください';
        return;
      }
      judgeLabelEl.textContent = judges[judgeId].name + ' 様';
      if (!scoreScreen.classList.contains('active')) {
        showScreen('grid');
        renderGrid();
      }
      statusBar.textContent = '';
    }

    buildFields();

    onValue(ref(db, 'v2/config/judges'), (snap) => {
      judges = snap.val() || {};
      route();
    });

    // 参照のみ（書き込みなし）
    onValue(ref(db, 'config/teams'), (snap) => {
      prelimTeams = snap.val() || {};
      if (gridScreen.classList.contains('active')) renderGrid();
    });

    onValue(ref(db, 'scores'), (snap) => {
      prelimScores = snap.val() || {};
      if (gridScreen.classList.contains('active')) renderGrid();
    });

    onValue(ref(db, 'v2/scores'), (snap) => {
      v2Scores = snap.val() || {};
      if (gridScreen.classList.contains('active')) renderGrid();
    });

    showScreen('judge');
  </script>
</body>
</html>
