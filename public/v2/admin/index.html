<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本番審査 - 管理者画面</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: #f0f2f5;
      color: #222;
    }

    header {
      background: #1a2a6c;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { margin: 0; font-size: 18px; }

    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .brand-logo:hover { opacity: 0.85; }

    main { max-width: 1000px; margin: 0 auto; padding: 20px; }

    .section {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .section h2 { margin: 0 0 14px; font-size: 17px; color: #1a2a6c; }

    table { width: 100%; border-collapse: collapse; }

    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; font-size: 14px; }

    th { background: #eef1fb; }

    .manage-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

    .manage-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #f6f7fb; border-radius: 6px;
    }

    .manage-item span { font-size: 15px; }

    .add-row { display: flex; gap: 8px; }

    .add-row input {
      flex: 1; padding: 8px 10px; font-size: 15px;
      border: 1px solid #bbb; border-radius: 6px;
    }

    .add-btn {
      padding: 8px 16px; background: #1a2a6c; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 15px;
    }

    .remove-btn {
      padding: 6px 12px; background: #b21f1f; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
    }

    .empty-note { color: #999; font-size: 14px; }

    .rank-1 td { background: #fff7d6; font-weight: bold; }

    .rank-complete { color: #1a7a1a; font-weight: bold; }
    .rank-incomplete { color: #999; }

    .cell-done { background: #eaf7ea; color: #1a7a1a; font-weight: bold; }
    .cell-pending { background: #ffeef0; color: #b21f1f; font-weight: bold; }

    .link-row { display: flex; align-items: center; gap: 10px; }
    .copy-link {
      font-size: 12px; color: #1a2a6c; background: #eef1fb;
      border: 1px solid #1a2a6c; border-radius: 6px; padding: 4px 10px; cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <a href="/v2" class="brand-logo">🏆 本番審査</a>
    <h1>管理者・進行画面</h1>
  </header>
  <main>
    <div class="section">
      <h2>1. 審査員管理</h2>
      <div class="manage-list" id="judgeManageList"></div>
      <div class="add-row">
        <input type="text" id="newJudgeName" placeholder="審査員名を入力" />
        <button class="add-btn" id="addJudgeBtn">追加</button>
      </div>
    </div>

    <div class="section">
      <h2>2. 総合順位（リアルタイム・100点満点平均）</h2>
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>アプリ</th>
            <th>平均スコア(100)</th>
            <th>合計スコア</th>
            <th>入力状況</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>

    <div class="section">
      <h2>3. 審査員×アプリ 採点進捗マトリックス</h2>
      <div style="overflow-x: auto;">
        <table id="matrixTable">
          <thead id="matrixHead"></thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const TOP_N = 12;

    const judgeManageList = document.getElementById('judgeManageList');
    const rankingBody = document.getElementById('rankingBody');
    const matrixHead = document.getElementById('matrixHead');
    const matrixBody = document.getElementById('matrixBody');

    let judges = {};        // /v2/config/judges
    let prelimTeams = {};    // /config/teams（参照のみ）
    let prelimScores = {};   // /scores（参照のみ）
    let v2Scores = {};       // /v2/scores

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));
    const judgeIds = () => byOrder(judges);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function prelimTeamNoMap() {
      const map = {};
      byOrder(prelimTeams).forEach((id, i) => {
        map[id] = (prelimTeams[id].no != null) ? prelimTeams[id].no : (i + 1);
      });
      return map;
    }

    function prelimTotal(teamId) {
      const s = prelimScores[teamId] || {};
      return Object.keys(s).reduce((sum, jid) => {
        const sc = s[jid];
        return sum + (sc && typeof sc.total === 'number' ? sc.total : 0);
      }, 0);
    }

    // 事前審査の上位12 teamId（得点降順・参照のみ）
    function computeTop12() {
      return byOrder(prelimTeams)
        .map((id) => ({ id, total: prelimTotal(id) }))
        .sort((a, b) => b.total - a.total)
        .slice(0, TOP_N)
        .map((r) => r.id);
    }

    // ----- 審査員管理 -----
    function renderJudgeManager() {
      judgeManageList.innerHTML = '';
      const ids = judgeIds();
      if (ids.length === 0) {
        judgeManageList.innerHTML = '<span class="empty-note">登録された審査員はいません。</span>';
        return;
      }
      ids.forEach((jid) => {
        const row = document.createElement('div');
        row.className = 'manage-item';

        const label = document.createElement('span');
        label.textContent = judges[jid].name;

        const actionBox = document.createElement('div');
        actionBox.className = 'link-row';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-link';
        copyBtn.textContent = '専用URLをコピー';
        copyBtn.addEventListener('click', () => {
          const url = location.origin + '/v2/judge?id=' + jid;
          navigator.clipboard.writeText(url).then(() => {
            copyBtn.textContent = 'コピー済み';
            setTimeout(() => { copyBtn.textContent = '専用URLをコピー'; }, 1500);
          });
        });

        const editBtn = document.createElement('button');
        editBtn.className = 'add-btn';
        editBtn.style.fontSize = '12px';
        editBtn.style.padding = '6px 12px';
        editBtn.textContent = '編集';
        editBtn.addEventListener('click', () => editJudge(jid));

        const delBtn = document.createElement('button');
        delBtn.className = 'remove-btn';
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', () => removeJudge(jid));

        actionBox.appendChild(copyBtn);
        actionBox.appendChild(editBtn);
        actionBox.appendChild(delBtn);

        row.appendChild(label);
        row.appendChild(actionBox);
        judgeManageList.appendChild(row);
      });
    }

    function addJudge() {
      const input = document.getElementById('newJudgeName');
      const name = input.value.trim();
      if (!name) return;
      push(ref(db, 'v2/config/judges'), { name, order: Date.now() });
      input.value = '';
    }

    function editJudge(jid) {
      const currentName = judges[jid].name;
      const newName = prompt('審査員名を変更してください:', currentName);
      if (newName !== null) {
        const trimmed = newName.trim();
        if (trimmed && trimmed !== currentName) {
          update(ref(db, 'v2/config/judges/' + jid), { name: trimmed });
        }
      }
    }

    function removeJudge(jid) {
      if (!confirm('審査員「' + judges[jid].name + '」を削除しますか？（本番の得点も削除されます）')) return;
      remove(ref(db, 'v2/config/judges/' + jid));
      computeTop12().forEach((teamId) => remove(ref(db, `v2/scores/${teamId}/${jid}`)));
    }

    document.getElementById('addJudgeBtn').addEventListener('click', addJudge);
    document.getElementById('newJudgeName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addJudge(); });

    // ----- 集計ユーティリティ -----
    function teamV2Scores(teamId) {
      const t = v2Scores[teamId] || {};
      return judgeIds().filter((jid) => t[jid]).map((jid) => t[jid]);
    }

    function teamAverage(teamId) {
      const arr = teamV2Scores(teamId);
      if (arr.length === 0) return 0;
      const sum = arr.reduce((a, s) => a + (typeof s.totalScore === 'number' ? s.totalScore : 0), 0);
      return sum / arr.length;
    }

    function teamSum(teamId) {
      return teamV2Scores(teamId).reduce((a, s) => a + (typeof s.totalScore === 'number' ? s.totalScore : 0), 0);
    }

    // ----- 総合順位 -----
    function renderRanking() {
      const total = judgeIds().length;
      const noMap = prelimTeamNoMap();
      const rows = computeTop12().map((teamId) => {
        const count = teamV2Scores(teamId).length;
        return {
          name: 'No.' + noMap[teamId] + ' ' + (prelimTeams[teamId] ? prelimTeams[teamId].name : teamId),
          avg: teamAverage(teamId),
          sum: teamSum(teamId),
          count,
          complete: total > 0 && count === total
        };
      }).sort((a, b) => b.avg - a.avg);

      rankingBody.innerHTML = '';
      if (rows.length === 0) {
        rankingBody.innerHTML = '<tr><td colspan="6" class="empty-note">対象アプリがありません（事前審査データ待ち）。</td></tr>';
        return;
      }
      rows.forEach((row, index) => {
        const rank = index + 1;
        const tr = document.createElement('tr');
        if (rank === 1) tr.classList.add('rank-1');
        tr.innerHTML =
          '<td>' + rank + '</td>' +
          '<td style="text-align:left;">' + escapeHtml(row.name) + '</td>' +
          '<td>' + row.avg.toFixed(1) + '</td>' +
          '<td>' + row.sum.toFixed(1) + '</td>' +
          '<td>' + row.count + ' / ' + total + '</td>' +
          '<td class="' + (row.complete ? 'rank-complete' : 'rank-incomplete') + '">' +
          (row.complete ? '入力完了' : '入力中') + '</td>';
        rankingBody.appendChild(tr);
      });
    }

    // ----- 採点進捗マトリックス -----
    function renderMatrix() {
      const tIds = computeTop12();
      const jIds = judgeIds();
      const noMap = prelimTeamNoMap();

      let headHtml = '<tr><th>アプリ / 審査員</th>';
      jIds.forEach((jid) => { headHtml += `<th>${escapeHtml(judges[jid].name)}</th>`; });
      headHtml += '<th>未採点数</th></tr>';
      matrixHead.innerHTML = headHtml;

      matrixBody.innerHTML = '';
      if (tIds.length === 0 || jIds.length === 0) {
        matrixBody.innerHTML = `<tr><td colspan="${jIds.length + 2}" class="empty-note">アプリまたは審査員が登録されていません。</td></tr>`;
        return;
      }

      tIds.forEach((teamId) => {
        const t = v2Scores[teamId] || {};
        let pendingCount = 0;
        let cellsHtml = '';
        jIds.forEach((jid) => {
          const sc = t[jid];
          if (sc && typeof sc.totalScore === 'number') {
            cellsHtml += `<td class="cell-done">✓ ${sc.totalScore.toFixed(1)}</td>`;
          } else {
            pendingCount++;
            cellsHtml += `<td class="cell-pending">未採点</td>`;
          }
        });
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align:left;"><strong>No.${noMap[teamId]} ${escapeHtml(prelimTeams[teamId] ? prelimTeams[teamId].name : teamId)}</strong></td>` +
          cellsHtml +
          `<td style="font-weight:bold; color:${pendingCount > 0 ? '#b21f1f' : '#1a7a1a'}">${pendingCount} 名</td>`;
        matrixBody.appendChild(tr);
      });
    }

    function renderAll() {
      renderJudgeManager();
      renderRanking();
      renderMatrix();
    }

    onValue(ref(db, 'v2/config/judges'), (snap) => { judges = snap.val() || {}; renderAll(); });
    // 参照のみ（書き込みなし）
    onValue(ref(db, 'config/teams'), (snap) => { prelimTeams = snap.val() || {}; renderAll(); });
    onValue(ref(db, 'scores'), (snap) => { prelimScores = snap.val() || {}; renderAll(); });
    onValue(ref(db, 'v2/scores'), (snap) => { v2Scores = snap.val() || {}; renderAll(); });
  </script>
</body>

</html>
