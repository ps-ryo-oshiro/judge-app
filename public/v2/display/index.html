<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本番審査 結果発表</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0d1030 0%, #1a1c4b 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 20px 20px 15px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      color: #ffd54a;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
    }
    .brand-logo:hover { opacity: 0.85; }
    header h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffd700, #fff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }
    header .subtitle { font-size: 16px; color: #aab8c2; margin-top: 8px; }
    main { max-width: 1920px; margin: 24px auto; padding: 0 20px; }
    .ranking-sections {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }
    .ranking-section { min-width: 0; }
    .section-title {
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 3px solid #ffd54a;
      color: #ffd54a;
      font-size: 22px;
    }
    .ranking-list { display: flex; flex-direction: column; gap: 12px; }
    .rank-card {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px 22px;
    }
    .rank-card.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.25) 0%, rgba(255, 215, 0, 0.08) 100%);
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .rank-card.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.25) 0%, rgba(192, 192, 192, 0.08) 100%);
      border: 2px solid #c0c0c0;
    }
    .rank-card.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.25) 0%, rgba(205, 127, 50, 0.08) 100%);
      border: 2px solid #cd7f32;
    }
    .rank-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .rank-number {
      font-size: 20px; font-weight: bold;
      width: 40px; height: 40px; flex: 0 0 40px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.1); border-radius: 50%;
    }
    .rank-1 .rank-number { background: #ffd700; color: #1a1c4b; }
    .rank-2 .rank-number { background: #c0c0c0; color: #1a1c4b; }
    .rank-3 .rank-number { background: #cd7f32; color: #fff; }
    .rank-name { font-size: 18px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
    .rank-developer {
      margin-top: 4px;
      color: #aab8c2;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-score { font-size: 15px; color: #aab8c2; }
    .rank-score strong { color: #ffd54a; font-size: 22px; margin: 0 4px; }
    .empty-msg { text-align: center; padding: 40px; font-size: 20px; color: #889; }
    .back-home { display: inline-block; margin-top: 18px; color: #8aa; font-size: 13px; text-decoration: none; }
    .back-home:hover { color: #ccd; }
    @media (max-width: 1300px) {
      .ranking-sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .ranking-sections { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div><a href="/v2" class="brand-logo">🏆 本番審査</a></div>
    <h1>結果発表</h1>
    <div class="subtitle">審査員合計スコア順</div>
  </header>
  <main>
    <div class="ranking-sections">
      <section class="ranking-section">
        <h2 class="section-title">ライフ部門</h2>
        <div class="ranking-list" id="lifeRankingList"></div>
      </section>
      <section class="ranking-section">
        <h2 class="section-title">ワーク部門</h2>
        <div class="ranking-list" id="workRankingList"></div>
      </section>
      <section class="ranking-section">
        <h2 class="section-title">ローカル部門</h2>
        <div class="ranking-list" id="localRankingList"></div>
      </section>
      <section class="ranking-section">
        <h2 class="section-title">ALL（総合）</h2>
        <div class="ranking-list" id="allRankingList"></div>
      </section>
    </div>
    <div style="text-align:center;">
      <a class="back-home" href="/v2">← メニューへ戻る</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvuwfX7132v4NFfqzCL25K8tVbspUeA6E",
      authDomain: "judge-app-f96e4.firebaseapp.com",
      databaseURL: "https://judge-app-f96e4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "judge-app-f96e4",
      storageBucket: "judge-app-f96e4.firebasestorage.app",
      messagingSenderId: "286536297446",
      appId: "1:286536297446:web:e2158c841726af21d34427",
      measurementId: "G-C3GB3GET6L"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const TOP_N = 12;
    const lifeRankingList = document.getElementById('lifeRankingList');
    const workRankingList = document.getElementById('workRankingList');
    const localRankingList = document.getElementById('localRankingList');
    const allRankingList = document.getElementById('allRankingList');

    let judges = {};
    let prelimTeams = {};
    let prelimScores = {};
    let v2Scores = {};

    // 提出一覧の No. と開発者（個人参加時はリーダー氏名）を対応付ける。
    const DEVELOPERS_BY_NO = {
      1: '加藤奏良',
      7: '山本 夢七',
      20: '新垣美子',
      22: 'KBC_A',
      33: 'FNS DEV',
      35: 'シーサートーク（ShisaTalk）',
      38: 'U3A2',
      39: 'Meelyze',
      44: '宮平 忍',
      46: 'レキサン',
      47: '一般社団法人 宜野湾青年会議所',
    };

    const byOrder = (obj) =>
      Object.keys(obj).sort((a, b) => (obj[a].order || 0) - (obj[b].order || 0));
    const judgeIds = () => byOrder(judges);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function prelimTeamNoMap() {
      const map = {};
      byOrder(prelimTeams).forEach((id, i) => {
        map[id] = (prelimTeams[id].no != null) ? prelimTeams[id].no : (i + 1);
      });
      return map;
    }

    function departmentOf(team, no) {
      const number = Number(no);
      if (number === 35 || number === 39 || (team && team.name && (team.name.includes('シーサートーク') || team.name.includes('Meelyze')))) return 'ローカル部門';
      if (team.department) return team.department;
      if (number >= 1 && number <= 24) return 'ライフ部門';
      if (number >= 25 && number <= 39) return 'ローカル部門';
      if (number >= 40 && number <= 48) return 'ワーク部門';
      return '部門未設定';
    }

    function prelimTotal(teamId) {
      const s = prelimScores[teamId] || {};
      return Object.keys(s).reduce((sum, jid) => {
        const sc = s[jid];
        return sum + (sc && typeof sc.total === 'number' ? sc.total : 0);
      }, 0);
    }

    function computeTop12() {
      const noMap = prelimTeamNoMap();
      const allSorted = byOrder(prelimTeams)
        .filter((id) => {
          const no = Number(noMap[id]);
          if ([16, 19, 24, 32, 36].includes(no)) return false;
          const name = (prelimTeams[id] && prelimTeams[id].name) || '';
          return !name.includes('マネコン') && !name.includes('OKI天気') && !name.includes('ソフトテニス') && !name.includes('ParkPal') && !name.includes('お得すぎるぜ');
        })
        .map((id) => ({ id, total: prelimTotal(id) }))
        .sort((a, b) => b.total - a.total);

      const topList = allSorted.slice(0, TOP_N).map((r) => r.id);
      allSorted.forEach((r) => {
        const no = Number(noMap[r.id]);
        const name = (prelimTeams[r.id] && prelimTeams[r.id].name) || '';
        if (no === 35 || no === 39 || name.includes('シーサートーク') || name.includes('Meelyze')) {
          if (!topList.includes(r.id)) {
            topList.push(r.id);
          }
        }
      });
      return topList;
    }

    function teamTotal(teamId) {
      const t = v2Scores[teamId] || {};
      return judgeIds().filter((jid) => t[jid]).reduce((a, jid) => {
        const s = t[jid];
        return a + (typeof s.totalScore === 'number' ? s.totalScore : 0);
      }, 0);
    }

    function render() {
      const noMap = prelimTeamNoMap();
      const rows = computeTop12().map((teamId) => ({
        name: 'No.' + noMap[teamId] + ' ' + (prelimTeams[teamId] ? prelimTeams[teamId].name : teamId),
        developer: DEVELOPERS_BY_NO[Number(noMap[teamId])] || '',
        department: departmentOf(prelimTeams[teamId] || {}, noMap[teamId]),
        total: teamTotal(teamId)
      })).sort((a, b) => b.total - a.total);

      const sections = [
        { list: lifeRankingList, rows: rows.filter((row) => row.department === 'ライフ部門') },
        { list: workRankingList, rows: rows.filter((row) => row.department === 'ワーク部門') },
        { list: localRankingList, rows: rows.filter((row) => row.department === 'ローカル部門') },
        { list: allRankingList, rows },
      ];
      if (rows.length === 0) {
        sections.forEach((section) => {
          section.list.innerHTML = '<div class="empty-msg">対象アプリがありません</div>';
        });
        return;
      }
      sections.forEach((section) => {
        section.list.innerHTML = '';
        if (section.rows.length === 0) {
          section.list.innerHTML = '<div class="empty-msg">該当アプリなし</div>';
          return;
        }
        section.rows.forEach((row, index) => {
          const rank = index + 1;
          const card = document.createElement('div');
          card.className = 'rank-card rank-' + rank;
          card.innerHTML =
            '<div class="rank-left">' +
            '<div class="rank-number">' + rank + '</div>' +
            '<div><div class="rank-name">' + escapeHtml(row.name) + '</div>' +
            (row.developer ? '<div class="rank-developer">' + escapeHtml(row.developer) + '</div>' : '') +
            '</div>' +
            '</div>' +
            '<div class="rank-score"><strong>' + row.total.toFixed(1) + '</strong>点</div>';
          section.list.appendChild(card);
        });
      });
    }

    onValue(ref(db, 'v2/config/judges'), (snap) => { judges = snap.val() || {}; render(); });
    // 参照のみ（書き込みなし）
    onValue(ref(db, 'config/teams'), (snap) => { prelimTeams = snap.val() || {}; render(); });
    onValue(ref(db, 'scores'), (snap) => { prelimScores = snap.val() || {}; render(); });
    onValue(ref(db, 'v2/scores'), (snap) => { v2Scores = snap.val() || {}; render(); });
  </script>
</body>
</html>
